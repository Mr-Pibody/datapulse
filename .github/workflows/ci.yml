name: DataPulse CI/CD

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,parquet,excel]"

      - name: Check formatting with Ruff
        run: ruff format --check src tests

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run static type checking with Mypy
        run: mypy src

      - name: Run full test suite with coverage
        run: pytest --cov=datapulse --cov-report=term-missing

  docker-build:
    name: Docker Multi-Stage Build Smoke Test
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t datapulse:ci .