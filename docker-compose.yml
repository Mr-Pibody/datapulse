services:
  datapulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: datapulse:14.0.0
    container_name: datapulse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATAPULSE_API_KEY: "${DATAPULSE_API_KEY:-}"
      DATAPULSE_AUTH_REQUIRED: "${DATAPULSE_AUTH_REQUIRED:-false}"
    volumes:
      - ./db:/app/db
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  datapulse-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: datapulse:14.0.0
    container_name: datapulse-watcher
    restart: unless-stopped
    depends_on:
      datapulse-api:
        condition: service_healthy
    volumes:
      - ./db:/app/db
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./data:/app/data
    command:
      [
        "datapulse",
        "watch",
        "--dir",
        "/app/data/inbox",
        "--archive-dir",
        "/app/data/archive",
        "--domain",
        "auto",
        "--interval",
        "10",
        "--quarantine",
      ]